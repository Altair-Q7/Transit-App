services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-sarathy}
      MARIADB_USER: ${MARIADB_USER:-sarathy}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # One-shot schema migration. Runs before the backend starts so Alembic is
  # the only schema path under compose (AUTO_CREATE_TABLES is forced off below).
  migrate:
    image: sarathy-backend:local
    build: ./backend
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+pymysql://${MARIADB_USER:-sarathy}:${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}@mariadb:3306/${MARIADB_DATABASE:-sarathy}
    depends_on:
      mariadb:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  backend:
    image: sarathy-backend:local
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Credentials come from the root .env (single source of truth —
      # see .env.example) rather than being duplicated here.
      DATABASE_URL: mysql+pymysql://${MARIADB_USER:-sarathy}:${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}@mariadb:3306/${MARIADB_DATABASE:-sarathy}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AUTO_CREATE_TABLES: "false"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips
      - ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    # Local dev only: production should front the API with a reverse proxy
    # instead of publishing the port directly.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  # Automated nightly backups (mysqldump, gzip, rotated after
  # BACKUP_RETENTION_DAYS). Files land in the `backups_data` volume — mount
  # that to real off-site storage in production, this alone is not a
  # disaster-recovery plan.
  backup:
    image: mariadb:11
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./infra/backup/backup.sh:/backup.sh:ro
      - backups_data:/backups
    entrypoint: ["sh", "/backup.sh"]

  web-admin:
    build:
      context: ./apps/web-admin
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    restart: unless-stopped
    # NEXT_PUBLIC_API_URL is inlined at image build time via the build arg
    # above, so no runtime environment entry is needed.
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mariadb_data:
  backups_data:
